<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edupage Rozvrh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .login-box, .content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #2980b9;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #2c3e50;
        }

        .logout-btn {
            width: auto;
            padding: 10px 20px;
            background: #e74c3c;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .lessons-container {
            background: #fff9e6;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .lesson-box {
            background: white;
            border: 4px solid #000;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .lesson-box:hover {
            transform: scale(1.05);
        }

        .lesson-number {
            font-size: 48px;
            font-weight: bold;
            color: #f39c12;
        }

        .lesson-name {
            font-size: 14px;
            color: #2c3e50;
            margin-top: 5px;
            font-weight: bold;
        }

        .lesson-room {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 3px;
        }

        .current-next {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .current-box, .next-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .current-box {
            border: 4px solid #27ae60;
        }

        .next-box {
            border: 4px solid #3498db;
        }

        .current-box h2 {
            color: #27ae60;
        }

        .next-box h2 {
            color: #3498db;
        }

        .big-number {
            font-size: 80px;
            font-weight: bold;
            margin: 20px 0;
        }

        .current-box .big-number {
            color: #27ae60;
        }

        .next-box .big-number {
            color: #3498db;
        }

        .subject-name {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
        }

        .subject-details {
            font-size: 16px;
            color: #7f8c8d;
            margin: 5px 0;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .current-next {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Přihlášení -->
    <div id="loginBox" class="login-box">
        <h1>Edupage Rozvrh</h1>
        <h3 style="text-align: center; color: #7f8c8d; margin-bottom: 20px;">SSPBRNO</h3>
        <input type="text" id="username" placeholder="Uživatelské jméno">
        <input type="password" id="password" placeholder="Heslo">
        <button onclick="login()">Přihlásit se</button>
    </div>

    <!-- Hlavní obsah -->
    <div id="content" class="container hidden">
        <div class="header">
            <div>
                <h1>Rozvrh hodin</h1>
                <p id="todayDate">DEN: </p>
            </div>
            <button class="logout-btn" onclick="logout()">Odhlásit se</button>
        </div>

        <div class="lessons-container">
            <h2>Hodiny</h2>
            <div class="lessons-grid" id="lessonsGrid"></div>
        </div>

        <div class="current-next">
            <div class="current-box">
                <h2>RN (Aktuální hodina)</h2>
                <div id="currentLesson"></div>
            </div>

            <div class="next-box">
                <h2>NEXT (Příští hodina)</h2>
                <div id="nextLesson"></div>
            </div>
        </div>
    </div>

    <script>
        // Simulovaná data - nahraď voláním API
        const mockData = {
            lessons: [
                { number: 1, subject: 'Matematika', room: 'A102', teacher: 'Mgr. Novák', time: '8:00-8:45' },
                { number: 2, subject: 'Čeština', room: 'B205', teacher: 'Mgr. Svobodová', time: '8:55-9:40' },
                { number: 3, subject: 'Angličtina', room: 'C101', teacher: 'Mgr. Smith', time: '9:50-10:35' },
                { number: 4, subject: 'Fyzika', room: 'F301', teacher: 'RNDr. Bílý', time: '10:45-11:30' },
                { number: 5, subject: 'Dějepis', room: 'D204', teacher: 'Mgr. Černá', time: '11:40-12:25' },
                { number: 6, subject: 'Tělocvik', room: 'Tělocvična', teacher: 'Mgr. Zelený', time: '12:35-13:20' },
                { number: 7, subject: 'Chemie', room: 'CH201', teacher: 'RNDr. Modrý', time: '13:30-14:15' },
                { number: 8, subject: '-', room: '-', teacher: '-', time: '14:25-15:10' }
            ],
            currentLessonIndex: 2, // Index 2 = 3. hodina
            nextLessonIndex: 3     // Index 3 = 4. hodina
        };

        function login() {
            const subdomain = 'sspbrno';
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('Vyplň všechna pole!');
                return;
            }

            // Zde by bylo volání na Python API:
            // fetch('https://zacek.dev/api/edupage/login', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({ subdomain, username, password })
            // })
            // .then(res => res.json())
            // .then(data => {
            //     if (data.success) {
            //         showContent(data);
            //     }
            // });

            // Simulace přihlášení
            setTimeout(() => {
                showContent(mockData);
            }, 500);
        }

        function showContent(data) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');

            // Dnešní datum
            const today = new Date().toLocaleDateString('cs-CZ', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.getElementById('todayDate').textContent = 'DEN: ' + today;

            // Vykreslení hodin
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = '';
            data.lessons.forEach(lesson => {
                const box = document.createElement('div');
                box.className = 'lesson-box';
                box.innerHTML = `
                    <div class="lesson-number">${lesson.number}</div>
                    <div class="lesson-name">${lesson.subject}</div>
                    <div class="lesson-room">${lesson.room}</div>
                `;
                grid.appendChild(box);
            });

            // Aktuální hodina
            const current = data.lessons[data.currentLessonIndex];
            document.getElementById('currentLesson').innerHTML = `
                <div class="big-number">${current.number}</div>
                <div class="subject-name">${current.subject}</div>
                <div class="subject-details">${current.teacher}</div>
                <div class="subject-details">Učebna: ${current.room}</div>
                <div class="subject-details">${current.time}</div>
            `;

            // Příští hodina
            const next = data.lessons[data.nextLessonIndex];
            document.getElementById('nextLesson').innerHTML = `
                <div class="big-number">${next.number}</div>
                <div class="subject-name">${next.subject}</div>
                <div class="subject-details">${next.teacher}</div>
                <div class="subject-details">Učebna: ${next.room}</div>
                <div class="subject-details">${next.time}</div>
            `;
        }

        function logout() {
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('content').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
