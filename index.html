<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edupage Rozvrh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a0000, #3d0000);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgb(160, 27, 27);
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: #e06f0c;
            margin-bottom: 5px;
        }

        .header-left p {
            color: #7f8c8d;
            font-size: 16px;
        }

        .header-right {
            text-align: right;
        }

        .current-time {
            font-size: 48px;
            font-weight: bold;
            color: #3498db;
            line-height: 1;
        }

        .current-date-small {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 20px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .lessons-container {
            background: #4a1010;
            padding: 30px;
            border-radius: 15px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .lesson-box {
            background: #2d0a0a;
            border: 4px solid #8b0000;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .lesson-box:hover {
            transform: scale(1.05);
        }

        .lesson-box.current {
            border-color: #ff8800;
            background: #3d1111;
        }

        .lesson-box.next {
            border-color: #000000;
            background: #331010;
        }

        .lesson-number {
            font-size: 48px;
            font-weight: bold;
            color: #ff6b6b;
        }

        .lesson-name {
            font-size: 14px;
            color: #ffaaaa;
            margin-top: 5px;
            font-weight: bold;
        }

        .lesson-room {
            font-size: 12px;
            color: #d4a5a5;
            margin-top: 3px;
        }

        .current-next {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .current-box, .next-box {
            background: rgb(71, 3, 3);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .current-box {
            border: 4px solid #27ae60;
        }

        .next-box {
            border: 4px solid #3498db;
        }

        .current-box h2 {
            color: #27ae60;
        }

        .next-box h2 {
            color: #3498db;
        }

        .big-number {
            font-size: 80px;
            font-weight: bold;
            margin: 20px 0;
        }

        .current-box .big-number {
            color: #27ae60;
        }

        .next-box .big-number {
            color: #3498db;
        }

        .subject-name {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
        }

        .subject-details {
            font-size: 16px;
            color: #7f8c8d;
            margin: 5px 0;
        }

        .no-lesson {
            color: #95a5a6;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }

        .day-selector {
            background: #2d0a0a;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-selector h3 {
            color: #ff6b6b;
            margin-bottom: 10px;
            text-align: center;
        }

        .day-button {
            background: #4a1010;
            border: 2px solid #8b0000;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #ffaaaa;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .day-button:hover {
            background: #5c1515;
            transform: scale(1.02);
        }

        .day-button.active {
            background: #cc0000;
            color: white;
            border-color: #8b0000;
        }

        .day-button.today {
            border-color: #ff4444;
            border-width: 3px;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .day-selector {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .day-button {
                flex: 1;
                min-width: 100px;
            }
        }

        @media (max-width: 768px) {
            .current-next {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .header-right {
                margin-top: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="content" class="container">
        <div class="header">
            <div class="header-left">
                <h1>Rozvrh hodin</h1>
                <p id="todayDate"></p>
            </div>
            <div class="header-right">
                <div class="current-time" id="currentTime">00:00:00</div>
                <div class="current-date-small" id="currentDateSmall"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="left-column">
                <div class="lessons-container">
                    <h2>Hodiny</h2>
                    <div class="lessons-grid" id="lessonsGrid">
                        <div class="loading">Načítání rozvrhu...</div>
                    </div>
                </div>

                <div class="current-next">
                    <div class="current-box">
                        <h2>Aktuální hodina</h2>
                        <div id="currentLesson">
                            <div class="loading">Načítání...</div>
                        </div>
                    </div>

                    <div class="next-box">
                        <h2>Příští hodina</h2>
                        <div id="nextLesson">
                            <div class="loading">Načítání...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="day-selector">
                <h3>Vyberte den</h3>
                <button class="day-button" data-day="1">Pondělí</button>
                <button class="day-button" data-day="2">Úterý</button>
                <button class="day-button" data-day="3">Středa</button>
                <button class="day-button" data-day="4">Čtvrtek</button>
                <button class="day-button" data-day="5">Pátek</button>
            </div>
        </div>
    </div>

    <script>
        let weekSchedule = {};
        let selectedDay = new Date().getDay(); // Aktuální den jako výchozí

        // API
        async function loadSchedule() {
            try {
                const response = await fetch('/api/rozvrh');
                if (!response.ok) {
                    throw new Error('Chyba při načítání rozvrhu');
                }
                weekSchedule = await response.json();
                console.log('Rozvrh načten:', weekSchedule);
                initDayButtons();
                showContent();
            } catch (error) {
                console.error('Chyba:', error);
                document.getElementById('lessonsGrid').innerHTML = 
                    '<p class="no-lesson">Chyba při načítání rozvrhu</p>';
                document.getElementById('currentLesson').innerHTML = 
                    '<p class="no-lesson">Chyba při načítání</p>';
                document.getElementById('nextLesson').innerHTML = 
                    '<p class="no-lesson">Chyba při načítání</p>';
            }
        }

        function initDayButtons() {
            const buttons = document.querySelectorAll('.day-button');
            const today = new Date().getDay();
            
            buttons.forEach(button => {
                const day = parseInt(button.dataset.day);
                
                // Označení dnešního dne
                if (day === today) {
                    button.classList.add('today');
                }
                
                // Event listener pro kliknutí
                button.addEventListener('click', () => {
                    selectedDay = day;
                    updateActiveButton();
                    showContent();
                });
            });
            
            updateActiveButton();
        }

        function updateActiveButton() {
            const buttons = document.querySelectorAll('.day-button');
            buttons.forEach(button => {
                const day = parseInt(button.dataset.day);
                if (day === selectedDay) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function parseTime(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function getCurrentAndNextLesson(lessons) {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            let currentIndex = -1;
            let nextIndex = -1;

            for (let i = 0; i < lessons.length; i++) {
                const [startTime, endTime] = lessons[i].time.split('-');
                const startMinutes = parseTime(startTime);
                const endMinutes = parseTime(endTime);

                if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                    currentIndex = i;
                    nextIndex = i + 1 < lessons.length ? i + 1 : -1;
                    break;
                } else if (currentMinutes < startMinutes) {
                    nextIndex = i;
                    break;
                }
            }

            return { currentIndex, nextIndex };
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('cs-CZ');
            const dateStr = now.toLocaleDateString('cs-CZ', { 
                day: 'numeric',
                month: 'numeric',
                year: 'numeric'
            });

            document.getElementById('currentTime').textContent = timeStr;
            document.getElementById('currentDateSmall').textContent = dateStr;
        }

        function showContent() {
            const now = new Date();
            const realDayOfWeek = now.getDay();
            
            const dayNames = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
            const selectedDayName = dayNames[selectedDay];
            
            // Zobrazení vybraného dne
            const today = now.toLocaleDateString('cs-CZ', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            
            if (selectedDay === realDayOfWeek) {
                document.getElementById('todayDate').textContent = `${selectedDayName.charAt(0).toUpperCase() + selectedDayName.slice(1)} - dnes`;
            } else {
                document.getElementById('todayDate').textContent = `${selectedDayName.charAt(0).toUpperCase() + selectedDayName.slice(1)}`;
            }

            // Bereme rozvrh pro vybraný den
            const lessons = weekSchedule[selectedDay] || [];

            if (lessons.length === 0) {
                document.getElementById('lessonsGrid').innerHTML = 
                    '<p class="no-lesson">Tento den nejsou žádné hodiny</p>';
                document.getElementById('currentLesson').innerHTML = 
                    '<p class="no-lesson">Žádná hodina</p>';
                document.getElementById('nextLesson').innerHTML = 
                    '<p class="no-lesson">Žádná hodina</p>';
                return;
            }

            // Pokud je vybraný den aktuální den, zjistíme aktuální a další hodinu
            let currentIndex = -1;
            let nextIndex = -1;
            
            if (selectedDay === realDayOfWeek) {
                const result = getCurrentAndNextLesson(lessons);
                currentIndex = result.currentIndex;
                nextIndex = result.nextIndex;
            }

            // Všechny hodiny
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = '';
            lessons.forEach((lesson, index) => {
                const box = document.createElement('div');
                box.className = 'lesson-box';
                if (index === currentIndex) box.classList.add('current');
                if (index === nextIndex) box.classList.add('next');
                
                box.innerHTML = `
                    <div class="lesson-number">${lesson.number}</div>
                    <div class="lesson-name">${lesson.subject}</div>
                    <div class="lesson-room">${lesson.room}</div>
                `;
                grid.appendChild(box);
            });

            // Aktuální hodina (pouze pokud je vybraný dnešní den)
            if (selectedDay === realDayOfWeek && currentIndex >= 0) {
                const current = lessons[currentIndex];
                document.getElementById('currentLesson').innerHTML = `
                    <div class="big-number">${current.number}</div>
                    <div class="subject-name">${current.subject}</div>
                    <div class="subject-details">${current.teacher}</div>
                    <div class="subject-details">Učebna: ${current.room}</div>
                    <div class="subject-details">${current.time}</div>
                `;
            } else {
                document.getElementById('currentLesson').innerHTML = 
                    '<p class="no-lesson">Žádná probíhající hodina</p>';
            }

            // Další hodina (pouze pokud je vybraný dnešní den)
            if (selectedDay === realDayOfWeek && nextIndex >= 0) {
                const next = lessons[nextIndex];
                document.getElementById('nextLesson').innerHTML = `
                    <div class="big-number">${next.number}</div>
                    <div class="subject-name">${next.subject}</div>
                    <div class="subject-details">${next.teacher}</div>
                    <div class="subject-details">Učebna: ${next.room}</div>
                    <div class="subject-details">${next.time}</div>
                `;
            } else {
                document.getElementById('nextLesson').innerHTML = 
                    '<p class="no-lesson">Žádná další hodina</p>';
            }
        }

        updateClock();
        loadSchedule();
        
        setInterval(updateClock, 1000);
        setInterval(showContent, 60000);
    </script>
</body>
</html>
