<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edupage Rozvrh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .header-left p {
            color: #7f8c8d;
            font-size: 16px;
        }

        .header-right {
            text-align: right;
        }

        .current-time {
            font-size: 48px;
            font-weight: bold;
            color: #3498db;
            line-height: 1;
        }

        .current-date-small {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .lessons-container {
            background: #fff9e6;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .lesson-box {
            background: white;
            border: 4px solid #000;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .lesson-box:hover {
            transform: scale(1.05);
        }

        .lesson-box.current {
            border-color: #27ae60;
            background: #e8f8f5;
        }

        .lesson-box.next {
            border-color: #3498db;
            background: #ebf5fb;
        }

        .lesson-number {
            font-size: 48px;
            font-weight: bold;
            color: #f39c12;
        }

        .lesson-name {
            font-size: 14px;
            color: #2c3e50;
            margin-top: 5px;
            font-weight: bold;
        }

        .lesson-room {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 3px;
        }

        .current-next {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .current-box, .next-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .current-box {
            border: 4px solid #27ae60;
        }

        .next-box {
            border: 4px solid #3498db;
        }

        .current-box h2 {
            color: #27ae60;
        }

        .next-box h2 {
            color: #3498db;
        }

        .big-number {
            font-size: 80px;
            font-weight: bold;
            margin: 20px 0;
        }

        .current-box .big-number {
            color: #27ae60;
        }

        .next-box .big-number {
            color: #3498db;
        }

        .subject-name {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
        }

        .subject-details {
            font-size: 16px;
            color: #7f8c8d;
            margin: 5px 0;
        }

        .no-lesson {
            color: #95a5a6;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }

        @media (max-width: 768px) {
            .current-next {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .header-right {
                margin-top: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="content" class="container">
        <div class="header">
            <div class="header-left">
                <h1>Rozvrh hodin</h1>
                <p id="todayDate"></p>
            </div>
            <div class="header-right">
                <div class="current-time" id="currentTime">00:00:00</div>
                <div class="current-date-small" id="currentDateSmall"></div>
            </div>
        </div>

        <div class="lessons-container">
            <h2>Hodiny</h2>
            <div class="lessons-grid" id="lessonsGrid">
                <div class="loading">Načítání rozvrhu...</div>
            </div>
        </div>

        <div class="current-next">
            <div class="current-box">
                <h2>Aktuální hodina</h2>
                <div id="currentLesson">
                    <div class="loading">Načítání...</div>
                </div>
            </div>

            <div class="next-box">
                <h2>Příští hodina</h2>
                <div id="nextLesson">
                    <div class="loading">Načítání...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Globální proměnná pro rozvrh načtený z API
        let weekSchedule = {};

        // Načtení rozvrhu z API
        async function loadSchedule() {
            try {
                const response = await fetch('/api/rozvrh');
                if (!response.ok) {
                    throw new Error('Chyba při načítání rozvrhu');
                }
                weekSchedule = await response.json();
                console.log('Rozvrh načten:', weekSchedule);
                showContent();
            } catch (error) {
                console.error('Chyba:', error);
                document.getElementById('lessonsGrid').innerHTML = 
                    '<p class="no-lesson">Chyba při načítání rozvrhu</p>';
                document.getElementById('currentLesson').innerHTML = 
                    '<p class="no-lesson">Chyba při načítání</p>';
                document.getElementById('nextLesson').innerHTML = 
                    '<p class="no-lesson">Chyba při načítání</p>';
            }
        }

        function parseTime(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function getCurrentAndNextLesson(lessons) {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            let currentIndex = -1;
            let nextIndex = -1;

            for (let i = 0; i < lessons.length; i++) {
                const [startTime, endTime] = lessons[i].time.split('-');
                const startMinutes = parseTime(startTime);
                const endMinutes = parseTime(endTime);

                if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                    currentIndex = i;
                    nextIndex = i + 1 < lessons.length ? i + 1 : -1;
                    break;
                } else if (currentMinutes < startMinutes) {
                    nextIndex = i;
                    break;
                }
            }

            return { currentIndex, nextIndex };
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('cs-CZ');
            const dateStr = now.toLocaleDateString('cs-CZ', { 
                day: 'numeric',
                month: 'numeric',
                year: 'numeric'
            });

            document.getElementById('currentTime').textContent = timeStr;
            document.getElementById('currentDateSmall').textContent = dateStr;
        }

        function showContent() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            
            const today = now.toLocaleDateString('cs-CZ', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.getElementById('todayDate').textContent = today;

            // Získání rozvrhu pro aktuální den
            const lessons = weekSchedule[dayOfWeek] || [];

            if (lessons.length === 0) {
                document.getElementById('lessonsGrid').innerHTML = 
                    '<p class="no-lesson">Dnes nejsou žádné hodiny</p>';
                document.getElementById('currentLesson').innerHTML = 
                    '<p class="no-lesson">Žádná hodina</p>';
                document.getElementById('nextLesson').innerHTML = 
                    '<p class="no-lesson">Žádná hodina</p>';
                return;
            }

            const { currentIndex, nextIndex } = getCurrentAndNextLesson(lessons);

            // Zobrazení všech hodin
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = '';
            lessons.forEach((lesson, index) => {
                const box = document.createElement('div');
                box.className = 'lesson-box';
                if (index === currentIndex) box.classList.add('current');
                if (index === nextIndex) box.classList.add('next');
                
                box.innerHTML = `
                    <div class="lesson-number">${lesson.number}</div>
                    <div class="lesson-name">${lesson.subject}</div>
                    <div class="lesson-room">${lesson.room}</div>
                `;
                grid.appendChild(box);
            });

            // Aktuální hodina
            if (currentIndex >= 0) {
                const current = lessons[currentIndex];
                document.getElementById('currentLesson').innerHTML = `
                    <div class="big-number">${current.number}</div>
                    <div class="subject-name">${current.subject}</div>
                    <div class="subject-details">${current.teacher}</div>
                    <div class="subject-details">Učebna: ${current.room}</div>
                    <div class="subject-details">${current.time}</div>
                `;
            } else {
                document.getElementById('currentLesson').innerHTML = 
                    '<p class="no-lesson">Žádná probíhající hodina</p>';
            }

            // Příští hodina
            if (nextIndex >= 0) {
                const next = lessons[nextIndex];
                document.getElementById('nextLesson').innerHTML = `
                    <div class="big-number">${next.number}</div>
                    <div class="subject-name">${next.subject}</div>
                    <div class="subject-details">${next.teacher}</div>
                    <div class="subject-details">Učebna: ${next.room}</div>
                    <div class="subject-details">${next.time}</div>
                `;
            } else {
                document.getElementById('nextLesson').innerHTML = 
                    '<p class="no-lesson">Žádná další hodina</p>';
            }
        }

        // Inicializace
        updateClock();
        loadSchedule();
        
        setInterval(updateClock, 1000);
        setInterval(showContent, 60000);
    </script>
</body>
</html>
